plugins { id "com.android.application" }

def keystoreProps = new Properties()
def keystoreFile = rootProject.file("keystore.properties")
if (keystoreFile.exists()) { keystoreFile.withInputStream { keystoreProps.load(it) } }

android {
    namespace "org.kumbhsahayak.app"
    compileSdk 36

    defaultConfig {
        applicationId "org.kumbhsahayak.app"
        minSdk 24
        targetSdk 36
        versionCode 1
        versionName "1.0"
        buildConfigField "String", "APP_URL", "\"${project.findProperty('appUrl')}\""
    }
    buildFeatures { buildConfig true }

    signingConfigs {
        release {
            if (keystoreProps["storeFile"]) {
                storeFile rootProject.file(keystoreProps["storeFile"])
                storePassword keystoreProps["storePassword"]
                keyAlias keystoreProps["keyAlias"]
                keyPassword keystoreProps["keyPassword"]
            }
        }
    }
    buildTypes {
        release {
            minifyEnabled false
            signingConfig keystoreProps["storeFile"] ? signingConfigs.release : signingConfigs.debug
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
